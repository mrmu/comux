# 秘密與內部識別字樣掃描（gitleaks）
#
# 規則：gitleaks 預設規則 + .gitleaks.toml 的自訂規則（*.ts.net 真實名稱、
# tag:pan-*、linode-*、lobster-*、寫死的 /Users/<帳號> 路徑）。
# push 時掃這次推上來的 commit，PR 時掃 PR 的 commit；手動執行（workflow_dispatch）
# 會掃整段歷史 —— 舊 commit 仍有內部字樣，除非改寫歷史，否則手動全掃會失敗。
#
# 注意：gitleaks-action 對「組織」擁有的 repo 需要 GITLEAKS_LICENSE secret
# （個人帳號的 repo 不需要）。
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action 用 API 列出 PR 的 commit

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # 不在 PR 上留言（只讓檢查失敗），避免把命中的內容再貼一次到公開頁面
          GITLEAKS_ENABLE_COMMENTS: "false"
